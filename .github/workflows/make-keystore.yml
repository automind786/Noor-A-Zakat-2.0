name: Make Keystore (sirf ek baar)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Naya password (kam az kam 8 akshar, yaad rakhein)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Keystore banayein
        run: |
          keytool -genkeypair -v -keystore noor-release.jks -alias noor -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Noor-A-Zakat, O=Noor, C=IN"
          base64 -w0 noor-release.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-BACKUP-KARO
          path: |
            noor-release.jks
            keystore_base64.txt
