name: Noor Zakat Amanah Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure live Islamic events feed for repository branch
        run: echo "NOOR_EVENTS_FEED_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/content/islamic-events.json" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace -PNOOR_EVENTS_FEED_URL="${NOOR_EVENTS_FEED_URL:-}"

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build
          name: "Noor Zakat Amanah v1.0.0 APK"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
