name: Build and Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read app version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate WebView assets
        run: node scripts/validate_web_assets.js

      - name: UI smoke test
        run: node scripts/smoke_test_ui.js

      - name: Build debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK & Prepare Release
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          zip -T "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          OUT="Noor-A-Zakat-${APP_VERSION}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Noor-A-Zakat-debug-apk
          path: |
            Noor-A-Zakat-*-debug.apk
            SHA256SUMS.txt
          compression-level: 0

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          name: Noor-A-Zakat v${{ steps.ver.outputs.name }} (Build ${{ github.run_number }})
          body: "Official Fixed Release: English UI overlap fixed, Audio reader removed, and Live rates refreshed."
          files: |
            Noor-A-Zakat-*-debug.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
