name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Signed Play Store AAB + release APK banayein? (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make gradlew executable (phone/Termux upload mein permission kho jati hai)
        run: chmod +x gradlew

      - name: Read app version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Validate WebView assets (language, Hijri/TTS remnants, Zakat logic)
        run: node scripts/validate_web_assets.js

      - name: UI smoke test (5 languages, English text, live rates)
        run: node scripts/smoke_test_ui.js

      - name: Unit tests and debug APK build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify debug APK integrity, package and signature
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          zip -T "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          OUT="Noor-A-Zakat-${APP_VERSION}-debug.apk"
          mkdir -p dist/debug
          cp "$APK" "dist/debug/$OUT"
          (cd dist/debug && sha256sum "$OUT" > SHA256SUMS.txt)
          {
            echo "INSTALL NOTE - Noor-A-Zakat Pro ${APP_VERSION} Debug"
            echo ""
            echo "1. GitHub artifact ZIP ko pehle Extract/Unzip karein."
            echo "2. ${OUT} file par tap karke install karein."
            echo "3. ZIP file ko Android app ki tarah install nahi kiya ja sakta."
            echo "4. Debug build alag package (com.hanafi.noorezakat.debug) hai; original Play Store app aur uska data alag/safe rahega."
            echo "5. Android prompt aaye to sirf apne trusted download ke liye browser/file-manager ko Install unknown apps permission dein."
          } > dist/debug/INSTALL-HI.txt
          {
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "APK signature and ZIP integrity verification passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Noor-A-Zakat-${{ steps.ver.outputs.name }}-debug-apk
          path: dist/debug/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test reports (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare release signing key
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > noor-release.jks
          test -s noor-release.jks
          printf 'storeFile=noor-release.jks\nstorePassword=%s\nkeyAlias=noor\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build signed Play Store bundle and release APK
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease -PADMOB_APP_ID="$ADMOB_APP_ID" -PADMOB_BANNER_ID="$ADMOB_BANNER_ID"

      - name: Verify signed release APK
        if: ${{ github.event.inputs.release == 'true' }}
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          zip -T "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="Noor-A-Zakat-${APP_VERSION}-release.apk"
          mkdir -p dist/release
          cp "$APK" "dist/release/$OUT"
          (cd dist/release && sha256sum "$OUT" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          name: Noor-A-Zakat-${{ steps.ver.outputs.name }}-release-apk
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          name: Noor-A-Zakat-${{ steps.ver.outputs.name }}-play-store-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release assets
        if: ${{ github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: Noor-A-Zakat v${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            dist/release/*.apk
            app/build/outputs/bundle/release/*.aab
            dist/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
