name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Play Store signed AAB bhi banayein?
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      VERSION_NAME: '3.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-A-Zakat-${{ env.VERSION_NAME }}-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noor-A-Zakat ${{ env.VERSION_NAME }} - Build ${{ github.run_number }}
          body: |
            Installable debug APK.
            Package: com.hanafi.noorezakat.debug
            SHA-256 is included in SHA256SUMS.txt.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Build signed Play Store AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > noor-release.jks
          printf 'storeFile=noor-release.jks\nstorePassword=%s\nkeyAlias=noor\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          ./gradlew bundleRelease -PADMOB_APP_ID="$ADMOB_APP_ID" -PADMOB_BANNER_ID="$ADMOB_BANNER_ID" --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Noor-A-Zakat-${{ env.VERSION_NAME }}-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          compression-level: 0
          if-no-files-found: error
