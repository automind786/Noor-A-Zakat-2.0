name: Noor-A-Zakat - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-A-Zakat-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="v3.0.1-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Noor-A-Zakat $TAG" \
            --generate-notes
